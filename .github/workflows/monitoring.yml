name: monitoring

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      - ".github/workflows/monitoring.yml"
  pull_request:
    paths:
      - "monitoring/**"
      - ".github/workflows/monitoring.yml"
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compose files parse
        run: |
          docker compose -f monitoring/docker-compose.yml config -q
          docker compose -f monitoring/compose.linux.yml config -q
          docker compose -f docker-compose.yml -f monitoring/compose.server.yml config -q

      - name: Dashboards are valid JSON with the uids the provisioner expects
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            jq empty "$f"
          done
          test -f monitoring/grafana/dashboards/overview.json
          jq -e '.uid == "uptime-overview"' monitoring/grafana/dashboards/overview.json >/dev/null
          jq -e '.uid == "uptime-internet"' monitoring/grafana/dashboards/internet.json >/dev/null
          jq -e '.uid == "uptime-network"'  monitoring/grafana/dashboards/network.json  >/dev/null
          jq -e '.uid == "uptime-capacity"' monitoring/grafana/dashboards/capacity.json >/dev/null
          jq -e '.uid == "uptime-business"' monitoring/grafana/dashboards/business.json >/dev/null

      - name: Serve the captured exposition
        run: |
          docker network create uptime-ci
          docker run -d --name metrics-fixture --network uptime-ci \
            -v "$PWD/monitoring/testdata/metrics.txt:/usr/share/nginx/html/metrics:ro" \
            -v "$PWD/monitoring/testdata/nginx-metrics.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.31.5-alpine

      - name: Start the stack against it
        run: |
          mkdir -p ci-targets
          printf '[{"targets":["metrics-fixture:80"],"labels":{"world":"ci"}}]\n' > ci-targets/uptime.json
          docker run -d --name prom --network uptime-ci -p 9090:9090 \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ci-targets:/etc/prometheus/targets:ro" \
            prom/prometheus:v3.14.0 --config.file=/etc/prometheus/prometheus.yml
          docker run -d --name graf --network uptime-ci -p 3000:3000 \
            -e PROM_URL=http://prom:9090 \
            -e GF_SECURITY_ADMIN_PASSWORD=uptime \
            -e GF_AUTH_ANONYMOUS_ENABLED=true \
            -e GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
            -v "$PWD/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "$PWD/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            grafana/grafana:13.2.1

      - name: Grafana comes up
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | jq -e '.database == "ok"'

      - name: Datasource and dashboards provisioned
        run: |
          curl -fsS -u admin:uptime http://127.0.0.1:3000/api/datasources/uid/uptime-prom \
            | jq -e '.type == "prometheus" and .isDefault == true'
          for uid in uptime-overview uptime-internet uptime-network uptime-capacity uptime-business; do
            curl -fsS -u admin:uptime "http://127.0.0.1:3000/api/dashboards/uid/$uid" \
              | jq -e --arg uid "$uid" '.dashboard.uid == $uid'
          done

      - name: Prometheus is scraping
        run: |
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:9090/api/v1/targets?state=active' \
              | jq -e '[.data.activeTargets[] | select(.scrapePool == "uptime") | .health] | index("up")' >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:9090/api/v1/targets?state=active' \
            | jq -e '[.data.activeTargets[] | select(.scrapePool == "uptime") | .health] | index("up")'

      # The check that earns its keep. A dashboard referring to a metric the
      # exporter does not emit looks fine in every schema check and renders an
      # empty panel in front of the player. Every uptime_ name in every
      # expression has to resolve against a body the exporter really produces.
      - name: Every metric a dashboard names exists
        run: |
          fail=0
          for m in $(jq -r '.. | objects | select(has("expr")) | .expr' monitoring/grafana/dashboards/*.json \
                     | grep -o 'uptime_[a-z0-9_]*' | sort -u); do
            n=$(curl -fsS "http://127.0.0.1:9090/api/v1/query?query=$m" | jq '.data.result | length')
            if [ "$n" -gt 0 ]; then
              echo "ok    $m"
            else
              echo "MISS  $m"
              fail=1
            fi
          done
          exit "$fail"

      - name: A query through Grafana returns the fixture's value
        run: |
          curl -fsS -u admin:uptime \
            'http://127.0.0.1:3000/api/datasources/proxy/uid/uptime-prom/api/v1/query?query=uptime_cash_dollars' \
            | jq -e '.data.result[0].value[1] == "184320.5"'

      - name: Logs on failure
        if: failure()
        run: |
          docker logs graf 2>&1 | tail -60
          docker logs prom 2>&1 | tail -40
          docker logs metrics-fixture 2>&1 | tail -20
