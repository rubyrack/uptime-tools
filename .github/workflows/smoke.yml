name: smoke

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t uptime-server:smoke docker

      - name: Start
        run: |
          docker volume create smoke-data
          docker run -d --name smoke \
            -v smoke-data:/data \
            -e UPTIME_PASSWORD=smoke-test-1 \
            -e UPTIME_NAME="CI smoke" \
            -e UPTIME_PUBLIC_ADDR=localhost:27016 \
            uptime-server:smoke

      - name: Wait for the Steam link
        run: |
          for i in $(seq 1 120); do
            docker logs smoke 2>&1 | grep -q '^\[server\] game-server SteamID: [0-9]' && break
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              docker logs smoke; exit 1
            fi
            sleep 5
          done
          docker logs smoke 2>&1 | tail -40
          docker logs smoke 2>&1 | grep -q 'game-server link up'
          docker logs smoke 2>&1 | grep -q '^\[server\] game-server SteamID: [0-9]'
          docker logs smoke 2>&1 | grep -q 'localhost:27016 -> 127.0.0.1:27016'

      - name: Healthcheck
        run: |
          for i in $(seq 1 24); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker inspect -f '{{json .State.Health}}' smoke; exit 1; }

      - name: Stop saves and exits 0
        run: |
          docker stop -t 60 smoke
          docker logs smoke 2>&1 | tail -20
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = "0" ]
          docker run --rm -v smoke-data:/data alpine test -s /data/worlds/main.save

      - name: Restart loads the world
        run: |
          docker rm smoke
          docker run -d --name smoke -v smoke-data:/data -e UPTIME_PASSWORD=smoke-test-1 uptime-server:smoke
          for i in $(seq 1 60); do
            docker logs smoke 2>&1 | grep -q 'world loaded from' && break
            sleep 5
          done
          docker logs smoke 2>&1 | grep 'world loaded from' || { docker logs smoke; exit 1; }
          docker stop -t 60 smoke
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = "0" ]

  # The same image the way Pterodactyl's Wings runs it: server at
  # /home/container, its user, the egg's startup line, stop by SIGINT.
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t uptime-server:smoke docker

      - name: Start with the egg's startup line and no install
        run: |
          # Wings bind-mounts a directory it owns; a named volume would reset
          # the ownership of an empty root on mount.
          mkdir -p "$RUNNER_TEMP/panel"
          sudo chown 988:988 "$RUNNER_TEMP/panel"
          docker run -d --name panel --user 988:988 \
            -v "$RUNNER_TEMP/panel":/home/container -w /home/container \
            -e HOME=/home/container -e USER=container \
            -e STARTUP="$(jq -r .startup pterodactyl/egg-uptime.json)" \
            -e SERVER_PORT=27016 -e AUTO_UPDATE=1 \
            -e UPTIME_WORLD=worlds/main.save -e UPTIME_SCENARIO=garage-to-glory \
            -e SERVER_NAME="CI panel" -e UPTIME_PASSWORD=smoke-test-1 \
            -e MAX_PLAYERS=4 -e AUTOSAVE_SECS=300 -e STEAM_PORT=27015 \
            -e SITE_FLAG= -e PUBLIC_ADDR_FLAG= -e PUBLIC_FLAG= -e HARD_FLAG= -e EXTRA_ARGS= \
            uptime-server:smoke

      - name: Wait for the Steam link
        run: |
          for i in $(seq 1 120); do
            docker logs panel 2>&1 | grep -q '^\[server\] game-server SteamID: [0-9]' && break
            if [ "$(docker inspect -f '{{.State.Running}}' panel)" != "true" ]; then
              docker logs panel; exit 1
            fi
            sleep 5
          done
          docker logs panel 2>&1 | tail -30
          docker logs panel 2>&1 | grep -q 'game-server link up'

      - name: SIGINT saves and exits 0
        run: |
          docker kill -s INT panel
          for i in $(seq 1 12); do
            [ "$(docker inspect -f '{{.State.Running}}' panel)" = "true" ] || break
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.ExitCode}}' panel)" = "0" ]
          sudo test -s "$RUNNER_TEMP/panel/worlds/main.save"
