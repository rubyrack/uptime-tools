name: Bug report
description: Something in the image, the compose examples or the egg does not work.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Docker image
        - Compose example
        - Pterodactyl egg
        - Tunnel (playit or pinggy)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: As shown in the game's main menu, for example 0.1.61.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your compose file or docker run line, with the password removed.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs uptime` or the panel console, from the start of the run.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
