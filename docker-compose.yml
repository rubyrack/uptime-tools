services:
  uptime:
    image: ghcr.io/rubyrack/uptime-server:latest
    container_name: uptime
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "27016:27016/udp"
    volumes:
      - uptime-data:/data
    environment:
      UPTIME_PASSWORD: change-me   # remove the line for an open server
      UPTIME_NAME: My Datacenter

volumes:
  uptime-data:
