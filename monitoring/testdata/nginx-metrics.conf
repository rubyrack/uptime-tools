# Serves testdata/metrics.txt at /metrics with the content type the real
# endpoint sends. CI only; nothing in the running stack uses this.
#
# The content type is spelled out rather than left to nginx's default, which is
# application/octet-stream. A scraper will still parse that as the text format,
# but a fixture that lies about its content type is a bad fixture.
server {
    listen 80;
    server_name _;

    location = /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /usr/share/nginx/html/metrics;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
