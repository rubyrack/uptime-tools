# Prometheus and Grafana watching a game running on THIS machine.
#
#   docker compose up -d        then open http://127.0.0.1:3000
#
# This file covers the Docker Desktop case (macOS, Windows), where
# host.docker.internal reaches the host's loopback and therefore the game's
# read-only API on 127.0.0.1:9875.
#
# On a Linux host it does not, because the game's API listens on loopback only
# and a bridge gateway cannot reach a loopback listener. Use compose.linux.yml
# instead, or run ./stack.sh up, which picks for you.
#
# To watch a dedicated server container instead, see compose.server.yml.

name: uptime-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: uptime-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets/desktop:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only, which matches how the endpoint it reads is published. This
    # is read-only data about your own world and it has no authentication.
    # Dropping the 127.0.0.1: prefix reaches it from elsewhere on your network,
    # and makes that data reachable by anyone who can route to this machine.
    ports:
      - "127.0.0.1:9090:9090"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: uptime-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      PROM_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: uptime
      # No login screen. Every visitor is an admin of the single org, which is
      # fine for a dashboard on loopback showing your own save file. Set this
      # to false before publishing the port to a network you do not control.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
