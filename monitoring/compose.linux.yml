# Prometheus and Grafana watching a game running on THIS machine, on Linux.
#
#   docker compose -f compose.linux.yml up -d
#
# Standalone, not an overlay: it is the same stack with one thing changed, and
# a standalone file cannot be got wrong by compose's list-merging rules.
#
# WHY LINUX IS DIFFERENT. The game's read-only API listens on 127.0.0.1 only,
# deliberately and with no flag to widen it. On Docker Desktop,
# host.docker.internal is proxied to the host and reaches that listener. On
# Linux, host-gateway is the bridge gateway address, and no route from a bridge
# network reaches a loopback listener. So instead of routing to the host, these
# containers JOIN it: with network_mode host, 127.0.0.1:9875 inside the
# container is literally the game's API.
#
# CONSEQUENCE: there are no published ports, because there is nothing to
# publish. Prometheus listens on the host's own 0.0.0.0:9090 and Grafana on
# 0.0.0.0:3000, reachable from anywhere that can reach this machine. If that is
# not a network you trust, put a firewall rule in front of 3000 and 9090.

name: uptime-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: uptime-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets/hostnet:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: uptime-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      PROM_URL: http://127.0.0.1:9090
      GF_SECURITY_ADMIN_PASSWORD: uptime
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
