apiVersion: 1

datasources:
  - name: Uptime
    type: prometheus
    uid: uptime-prom
    access: proxy
    # Set by the compose layer, because it differs between them:
    # http://prometheus:9090 on a bridge network, http://127.0.0.1:9090 when
    # the stack shares the host's network stack (compose.linux.yml).
    url: $PROM_URL
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Matches the scrape interval, so $__rate_interval and every panel's
      # minimum step land on the real sample spacing instead of guessing at it.
      timeInterval: 5s
      manageAlerts: false
